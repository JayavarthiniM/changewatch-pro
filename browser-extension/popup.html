<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:14px system-ui;width:290px;margin:0;padding:16px;background:#10111a;color:#f7f7fb}h2{font-size:17px;margin:0 0 8px}p{color:#b8b8c9;font-size:12px;line-height:1.5}button{border:0;border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:650}#pick{background:#a99bff;color:#171322;width:100%}#copy{background:#29283a;color:white;width:100%;margin-top:8px}textarea{box-sizing:border-box;width:100%;height:58px;background:#1b1b29;color:#eee;border:1px solid #45445b;border-radius:8px;padding:8px;resize:vertical}#status{min-height:18px}</style></head><body><h2>ChangeWatch Region Picker</h2><p>Open the public page you want to monitor, choose “Pick region”, then click the page element. Copy its CSS selector into the Watch selector field in ChangeWatch Pro.</p><button id="pick">Pick region on this page</button><p id="status">Ready.</p><label for="selector">Selected CSS selector</label><textarea id="selector" placeholder="e.g. main .price"></textarea><button id="copy">Copy selector</button><script src="popup.js"></script></body></html>
